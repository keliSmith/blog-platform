# Blog Platform - 生产环境 (Docker Compose 一体化)
#
# 组件: mysql + redis + backend(FastAPI) + frontend(Nginx) + certbot(Let's Encrypt)
# 前端用相对路径 /api /uploads 调用后端，因此单域名 + Nginx 反代即可，无需 CORS。
#
# 用法:
#   cd deploy
#   bash deploy.sh          # 一键：建库 -> 起后端 -> 起前端(HTTP) -> 申请证书 -> 切 HTTPS
#
# 说明:
#   - 本文件中的 ${VAR} 由 deploy.sh 在执行前 source .env.prod 后注入 shell 环境变量完成插值。
#   - 数据库账号/密码来自 .env.prod (MYSQL_ROOT_PASSWORD / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE)。

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app-net]

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [app-net]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      APP_ENV: production
      DEBUG: "False"
      # 生产数据库强制使用异步驱动 asyncmy (config.py 默认 mysql+pymysql 在异步引擎下不可用)
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-blog_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-blog}?charset=utf8mb4
      UPLOAD_BASE_URL: https://${DOMAIN}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health'); sys.exit(0)\" or exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - backend_uploads:/app/uploads
    networks: [app-net]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 预构建的 dist 由 CI (GitHub Actions runner) 构建后 SCP 到服务器,
      # 这里直接 bind mount 进容器, 服务器不再跑 vite build。
      # 路径相对本 compose 文件 (deploy/), 即 /opt/blog-platform/frontend/dist
      - ./../frontend/dist:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [app-net]

  # 仅用于证书申请/续期 (docker compose run --rm certbot ...)；不在 up 中常驻
  certbot:
    image: certbot/certbot:latest
    container_name: blog-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [app-net]
    profiles: ["certbot"]

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
  certbot_certs:
  certbot_www:

networks:
  app-net:
    driver: bridge

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "blog-backend"
version = "0.2.0"
description = "Blog Platform Backend API (FastAPI)"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
mysql = [
    "asyncmy>=0.2.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = 'migrations/versions/'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations/versions/"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]
exclude = ["migrations/versions/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # unused arguments
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment
    "RUF012", # mutable class defaults
    "B008",  # Depends() in function defaults — standard FastAPI pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["migrations/versions/"]
strict = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["migrations/versions/*"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

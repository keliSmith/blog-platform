# Dev Container 全套栈编排：应用 + MySQL 8.0 + Redis 7
# 由 .devcontainer/devcontainer.json 通过 dockerComposeFile 引用。
# 工作区由 VS Code 自动挂载到 app 服务；端口转发 / 命名卷 / postCreateCommand /
# 环境变量均在 devcontainer.json 中配置并应用到 app 服务。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    # 将本地仓库源码挂载进容器（compose 模式下需显式声明，VS Code 不会重复挂载）
    volumes:
      - ../:/workspaces/blog-platform-main:cached
    environment:
      APP_ENV: development
      APP_RELOAD: "1"
      # 容器内默认直接用 Dev Container 提供的 MySQL（主机名是 compose 服务名 db）。
      # 这里注入的环境变量优先级高于 backend/.env 中的空 DATABASE_URL，
      # 因此无需手动改 .env 即可用上 MySQL；原生本机开发（不在容器内）不受影响，仍走 SQLite。
      DATABASE_URL: "mysql+pymysql://blog_user:blog_password@db:3306/blog?charset=utf8mb4"
    # 直接把应用端口发布到宿主，保证无论用 VS Code Dev Containers 的 forwardPorts
    # 还是直接用 docker compose 启动，宿主浏览器都能访问 localhost:3000 / :8000。
    # 与 devcontainer.json 的 forwardPorts 并存，不冲突。
    ports:
      - "3000:3000"
      - "8000:8000"
    # 等 MySQL 健康后再启动应用，避免连库失败
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: blog
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: blog_password
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

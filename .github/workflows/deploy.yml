name: Deploy (Frontend + Backend)

# 触发: 推送到 main, 且改动涉及 frontend/backend/本 workflow 时自动部署
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'

# 避免并发部署互相干扰
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REMOTE_DIR: /opt/blog-platform   # 服务器上项目根目录 (deploy/ 的上一级), 按需修改

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
       # ---------- 彻底清理工作区（删除所有内容，包括 .git） ----------
      - name: Clean workspace for fresh clone
        run: |
          # 1. 确保工作目录存在（如果之前被删除，先创建）
          mkdir -p ${{ github.workspace }}
          
          # 2. 删除所有可见文件/文件夹
          rm -rf ${{ github.workspace }}/*
          
          # 3. 删除所有隐藏文件/文件夹（特别是 .git）
          rm -rf ${{ github.workspace }}/.git
          # 可选：删除其他隐藏配置文件（如 .env, .cache 等）
          rm -rf ${{ github.workspace }}/.??*
        shell: bash
      # ---------- 清理结束 ----------

      - name: Checkout
        uses: actions/checkout@v4

      # 判断本次 push 改了前端还是后端, 只重建对应的服务, 不浪费时间
      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端在 GitHub runner 上构建 (资源充足, 不占服务器)
      - name: Install & Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Copy dist to server
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "frontend/dist"
          target: "${{ env.REMOTE_DIR }}"

      # 在服务器上: 同步仓库(git pull) -> 按需重建 frontend/backend -> 重启
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_FRONTEND: ${{ steps.changes.outputs.frontend }}
          DEPLOY_BACKEND: ${{ steps.changes.outputs.backend }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ env.REMOTE_DIR }}
            # 若服务器是 git 仓库, 先拉取最新代码 (同步 Dockerfile/compose/后端等)
            if [ -d .git ]; then git pull --ff-only; fi
            cd deploy
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              docker compose -f docker-compose.prod.yml build frontend
              docker compose -f docker-compose.prod.yml up -d frontend
            fi
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              docker compose -f docker-compose.prod.yml build backend
              docker compose -f docker-compose.prod.yml up -d backend
            fi
